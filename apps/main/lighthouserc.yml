# Lighthouse CI budget for main, run by `.github/workflows/lighthouse.yml` on the E2E build
# (seeded database, no analytics or Sentry scripts). Scores use Lighthouse's default mobile
# emulation with simulated throttling, three runs each, judged on the median run.
#
# The thresholds sit just below what these pages scored locally (median of three: home performance
# 88, LCP 3.6 s; lesson page 86, LCP 4.1 s; accessibility 100 on both), so a regression fails the
# job without flaking on run-to-run noise.
ci:
  collect:
    startServerCommand: node ../../scripts/run-test-env.mts e2e next start -p 3100
    startServerReadyPattern: Ready in
    startServerReadyTimeout: 120000
    numberOfRuns: 3
    url:
      - http://localhost:3100/
      - http://localhost:3100/b/ai/c/quantum-physics-from-scratch/ch/inside-the-atom/l/why-doesnt-the-electron-fall-in
  assert:
    assertMatrix:
      - matchingUrlPattern: ^http://localhost:3100/$
        assertions:
          categories:performance: [error, { minScore: 0.85, aggregationMethod: median-run }]
          categories:accessibility: [error, { minScore: 1, aggregationMethod: median-run }]
          largest-contentful-paint:
            [error, { maxNumericValue: 4000, aggregationMethod: median-run }]
      - matchingUrlPattern: /l/why-doesnt-the-electron-fall-in$
        assertions:
          categories:performance: [error, { minScore: 0.83, aggregationMethod: median-run }]
          categories:accessibility: [error, { minScore: 1, aggregationMethod: median-run }]
          largest-contentful-paint:
            [error, { maxNumericValue: 4500, aggregationMethod: median-run }]
  upload:
    target: filesystem
    outputDir: .lighthouseci
