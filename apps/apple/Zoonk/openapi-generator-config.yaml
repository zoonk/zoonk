    - createAppleSession
    - createAppleSubscription
    - createEmailCodeSession
    - createEmailSignInCode
    - createFeedback
    - createGoogleSession
    - deleteCurrentSession
    - deleteCurrentUser
    - getChapter
    - getChapterNextLesson
    - getChapterProgress
    - getCourse
    - getCourseNextLesson
    - getCourseProgress
    - getCurrentUser
    - getCurrentUserActivity
    - getCurrentUserEnergy
    - getCurrentUserLevel
    - getCurrentUserProgress
    - getCurrentUserScore
    - getCurrentUserScorePatterns
    - listChapterLessons
    - listCourseChapters
    - listCourses
    - listCurrentUserCourses
    - renewCurrentSession
    - searchCatalog
    - updateCurrentUser
