generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
# The lesson player decodes screens and answers into its own types: the generated unions of every
# screen kind and activity template are index-named and far larger than what it reads.
typeOverrides:
  schemas:
    LessonMap: LessonSummary
    LessonStepAnswer: LessonAnswer
    LessonStepAnswerOutput: LessonAnswer
    # A visual of a kind this build doesn't know draws nothing instead of failing the response.
    LessonVisual: ZoonkAPI.LessonVisual
    PlayableLibraryStep: LessonStep
    # A new reason keeps the row outside the plan, with the plain label.
    NotPlannedReason: Swift.String
