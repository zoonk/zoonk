name: Production Release

on:
  release:
    types: [published]

concurrency:
  group: production-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID_API: ${{ vars.VERCEL_PROJECT_ID_API }}
  VERCEL_PROJECT_ID_MAIN: ${{ vars.VERCEL_PROJECT_ID_MAIN }}
  VERCEL_PROJECT_ID_ADMIN: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}

jobs:
  release:
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      DEPLOY_TARGET: production
      DEPLOY_REF: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH }}
      NEON_STAGING_BRANCH: ${{ vars.NEON_STAGING_BRANCH }}
      NEON_DATABASE: ${{ vars.NEON_DATABASE }}
      NEON_ROLE: ${{ vars.NEON_ROLE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      # Node comes from the runner's tool cache: pnpm/setup would download it from nodejs.org,
      # whose slow downloads time jobs out.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Require successful CI for the tagged commit
        run: pnpm deploy:validate-release
      - name: Load production database credentials
        run: pnpm deploy:database
      - name: Migrate production once
        run: pnpm --filter @zoonk/db db:deploy
      - name: Deploy all production apps concurrently on Turbo machines
        run: pnpm deploy production
