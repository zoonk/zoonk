name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  checks-needed:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node comes from the runner's tool cache: pnpm/setup would download it from nodejs.org,
      # whose slow downloads time jobs out.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm deploy:ci-required

  quality:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  main-e2e:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/e2e-main.yml
    secrets: inherit

  api-e2e:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/e2e-api.yml
    secrets: inherit

  vitest:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/vitest.yml
    secrets: inherit
