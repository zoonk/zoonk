name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID_API: ${{ vars.VERCEL_PROJECT_ID_API }}
  VERCEL_PROJECT_ID_MAIN: ${{ vars.VERCEL_PROJECT_ID_MAIN }}
  VERCEL_PROJECT_ID_ADMIN: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}

jobs:
  checks-needed:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node comes from the runner's tool cache. pnpm/setup would download it from nodejs.org (it
      # reads `.tool-versions`), whose slow downloads timed jobs out, so it only sets up pnpm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm deploy:ci-required

  quality:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  main-e2e:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/e2e-main.yml
    secrets: inherit

  api-e2e:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/e2e-api.yml
    secrets: inherit

  vitest:
    needs: checks-needed
    if: needs.checks-needed.outputs.required == 'true'
    uses: ./.github/workflows/vitest.yml
    secrets: inherit

  staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, vitest, main-e2e, api-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DEPLOY_TARGET: staging
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_REF: main
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH }}
      NEON_STAGING_BRANCH: ${{ vars.NEON_STAGING_BRANCH }}
      NEON_DATABASE: ${{ vars.NEON_DATABASE }}
      NEON_ROLE: ${{ vars.NEON_ROLE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node comes from the runner's tool cache. pnpm/setup would download it from nodejs.org (it
      # reads `.tool-versions`), whose slow downloads timed jobs out, so it only sets up pnpm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Load staging database credentials
        run: pnpm deploy:database
      - name: Migrate staging once
        run: pnpm --filter @zoonk/db db:deploy
      - name: Deploy staging apps
        run: pnpm deploy staging
