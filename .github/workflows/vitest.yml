name: Vitest

# Every Vitest suite (`pnpm test`): unit tests, database integration tests against a fresh Postgres
# migrated from scratch, and the player's browser tests. On every PR, and again on `main` before
# staging, where `ci.yml` calls this workflow.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # MEASUREMENT: how many suites at once a 4-vCPU runner keeps busy without starving tests.
    strategy:
      fail-fast: false
      matrix:
        concurrency: [1, 2, 10]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zoonk_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/zoonk_test
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      # Postgres pulls and starts while the code checks out and installs; as a service container it
      # held the job ~13 s before its first step. Test suites run at the same time, each worker with
      # up to 10 connections, more than Postgres' default 100 allows.
      - name: Start Postgres
        run: >-
          docker run --detach --name db --publish 5432:5432
          --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=zoonk_test
          postgres:18-alpine -c max_connections=200 > "$RUNNER_TEMP/db.log" 2>&1 &

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true

      # Over TCP: while the image sets up its database, Postgres only listens on its socket.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 120); do
            docker exec db pg_isready --host 127.0.0.1 --quiet 2> /dev/null && exit 0
            sleep 0.5
          done

          cat "$RUNNER_TEMP/db.log"
          docker logs db
          exit 1

      - name: Sample CPU
        run: (vmstat -n 2 > "$RUNNER_TEMP/vmstat.log" &)

      # Migrates the test database first (`db:setup:test`), then runs every suite.
      - name: Run Vitest
        run: pnpm turbo run test --concurrency=${{ matrix.concurrency }} --continue
        env:
          TURBO_FORCE: "true"

      - name: CPU use
        if: always()
        run: |
          awk 'NR > 2 { n++; us += $13; sy += $14; id += $15; wa += $16; r += $1 }
            END { printf "samples=%d user=%.0f%% sys=%.0f%% idle=%.0f%% wait=%.0f%% runnable=%.1f\n", n, us/n, sy/n, id/n, wa/n, r/n }' "$RUNNER_TEMP/vmstat.log"
          awk 'NR > 2 { printf "%s%d", (NR > 3 ? " " : ""), 100 - $15 } END { print "" }' "$RUNNER_TEMP/vmstat.log"
