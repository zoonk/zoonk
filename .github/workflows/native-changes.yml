name: Native App Changes

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
    outputs:
      changed:
        value: ${{ jobs.changes.outputs.changed }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Check out PR head
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github

      # PR path filters compare the whole branch, including earlier native edits.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#git-diff-comparisons
      # The push's own `before` would miss edits whose run was cancelled, so compare with the newest passing run.
      - name: Check files changed since the last passing run
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          APP: ${{ inputs.app }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" != pull_request || "$ACTION" != synchronize ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A fork's PR can share this branch name, so keep only runs of this PR's own repository.
          passed=$(gh api "repos/$REPO/actions/workflows/$APP.yml/runs?branch=$BRANCH&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$HEAD_REPO\")][0].head_sha // \"\"") || passed=""
          if [[ -z "$passed" ]] || ! git fetch --no-tags --filter=blob:none --depth=1 origin "$passed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing with $passed, the head of the newest passing run"
          files=$(git diff --name-only --no-renames "$passed" HEAD -- \
            "apps/$APP/" ".github/workflows/$APP.yml" ".github/workflows/native-changes.yml")
          if [[ -n "$files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
