name: E2E Tests (Main App)

# Main's Playwright suite (`pnpm e2e:main`): on every PR, and again on `main` before staging, where
# `ci.yml` calls this workflow.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Every job builds the API and Main, then runs its share of the tests, dealt test by test so
      # each file's time spreads over every shard (`pnpm e2e:main --shard`). The dependent
      # live-call-states project runs in its own job: Playwright runs a sharded project's
      # dependencies whole in each shard. That job is the shortest, so it also checks Main's
      # performance budgets and saves the build caches.
      matrix:
        include:
          - { suite: chromium 1/13, args: --project=chromium --shard=1/13 }
          - { suite: chromium 2/13, args: --project=chromium --shard=2/13 }
          - { suite: chromium 3/13, args: --project=chromium --shard=3/13 }
          - { suite: chromium 4/13, args: --project=chromium --shard=4/13 }
          - { suite: chromium 5/13, args: --project=chromium --shard=5/13 }
          - { suite: chromium 6/13, args: --project=chromium --shard=6/13 }
          - { suite: chromium 7/13, args: --project=chromium --shard=7/13 }
          - { suite: chromium 8/13, args: --project=chromium --shard=8/13 }
          - { suite: chromium 9/13, args: --project=chromium --shard=9/13 }
          - { suite: chromium 10/13, args: --project=chromium --shard=10/13 }
          - { suite: chromium 11/13, args: --project=chromium --shard=11/13 }
          - { suite: chromium 12/13, args: --project=chromium --shard=12/13 }
          - { suite: chromium 13/13, args: --project=chromium --shard=13/13 }
          - { suite: live-call-states, args: --project=live-call-states --no-deps, gates: true }
    env:
      BETTER_AUTH_SECRET: test-secret-for-ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zoonk_e2e
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/zoonk_e2e
      E2E_TESTING: "true"
      MAIN_PERF_GATES: ${{ matrix.gates && 'true' || 'false' }}
      NEXT_PUBLIC_APP_DOMAIN: localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      # Postgres pulls and starts while the code checks out and installs (see `vitest.yml`).
      - name: Start Postgres
        run: >-
          docker run --detach --name db --publish 5432:5432 --tmpfs /var/lib/postgresql
          --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=zoonk_e2e
          --env POSTGRES_INITDB_ARGS=--no-sync
          postgres:18-alpine -c max_connections=200 > "$RUNNER_TEMP/db.log" 2>&1 &

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Hashed once, before dependencies are installed: a cache's post step evaluates its inputs
      # again, and `hashFiles` would then walk every node_modules (about 20 s per cache).
      - name: Compute cache keys
        id: cache-keys
        run: |
          echo "lockfile=${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
          echo "sources=${{ hashFiles('apps/main/**/*.ts', 'apps/main/**/*.tsx', 'apps/api/**/*.ts', 'packages/**/*.ts', 'packages/**/*.tsx') }}" >> "$GITHUB_OUTPUT"

      # Turbopack's build caches: a warm build compiles only what changed since the cache's run.
      # The API's is its own entry, which the API's E2E job restores too (`e2e-api.yml`).
      - name: Restore Main's build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/main/.next-e2e/cache
          key: nextjs-e2e-main-${{ steps.cache-keys.outputs.lockfile }}-${{ steps.cache-keys.outputs.sources }}
          restore-keys: nextjs-e2e-main-${{ steps.cache-keys.outputs.lockfile }}-

      - name: Restore the API's build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/api/.next-e2e/cache
          key: nextjs-e2e-api-${{ steps.cache-keys.outputs.lockfile }}-${{ steps.cache-keys.outputs.sources }}
          restore-keys: nextjs-e2e-api-${{ steps.cache-keys.outputs.lockfile }}-

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # Over TCP: while the image sets up its database, Postgres only listens on its socket.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 120); do
            docker exec db pg_isready --host 127.0.0.1 --quiet 2> /dev/null && exit 0
            sleep 0.5
          done

          cat "$RUNNER_TEMP/db.log"
          docker logs db
          exit 1

      - name: Test performance gates
        if: matrix.gates
        run: pnpm test:deploy scripts/perf

      # Migrates the database, builds and starts the API, builds Main (timing it and checking its
      # performance budgets in the gates job), then runs the job's tests.
      - name: Run E2E tests
        run: pnpm e2e:main ${{ matrix.args }} --workers=2

      # Saved whether the tests passed or not, so the next run's builds start warm.
      - name: Save Main's build cache
        if: always() && matrix.gates
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/main/.next-e2e/cache
          key: nextjs-e2e-main-${{ steps.cache-keys.outputs.lockfile }}-${{ steps.cache-keys.outputs.sources }}

      - name: Save the API's build cache
        if: always() && matrix.gates
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/api/.next-e2e/cache
          key: nextjs-e2e-api-${{ steps.cache-keys.outputs.lockfile }}-${{ steps.cache-keys.outputs.sources }}

  # The one check branch protection requires: it passes only when every part passed.
  e2e-main:
    if: always()
    needs: suites
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: test "${{ needs.suites.result }}" = success
