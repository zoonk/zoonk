name: E2E Tests (Main App)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e:
    # Named by number alone, as main's required checks list them.
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Playwright splits shards by test count in file order, and an accessibility test, which scans
        # every screen at two widths in light and dark, takes as long as about ten flow tests. So the
        # accessibility tests get shards of their own instead of all landing in the first one.
        include:
          - { shard: 1, filter: --grep-invert, part: 1/6 }
          - { shard: 2, filter: --grep-invert, part: 2/6 }
          - { shard: 3, filter: --grep-invert, part: 3/6 }
          - { shard: 4, filter: --grep-invert, part: 4/6 }
          - { shard: 5, filter: --grep-invert, part: 5/6 }
          - { shard: 6, filter: --grep-invert, part: 6/6 }
          - { shard: 7, filter: --grep, part: 1/2 }
          - { shard: 8, filter: --grep, part: 2/2 }
    env:
      BETTER_AUTH_SECRET: test-secret-for-ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zoonk_e2e
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/zoonk_e2e
      E2E_TESTING: "true"
      NEXT_PUBLIC_APP_DOMAIN: localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    services:
      db:
        image: postgres:18-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zoonk_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/main/.next-e2e/cache
          key: ${{ runner.os }}-nextjs-main-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/main/**/*.ts', 'apps/main/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-main-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-main-

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Setup database
        run: pnpm --filter @zoonk/db db:setup:e2e

      - name: Run E2E tests
        # Playwright's grep also matches the test's file name.
        run: pnpm e2e --filter main -- ${{ matrix.filter }} 'accessibility-[a-z]+[.]test[.]ts' --shard=${{ matrix.part }}
