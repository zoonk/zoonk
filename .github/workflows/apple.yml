name: Apple App

on:
  push:
    branches: [main]
    paths:
      - apps/apple/**
      - .github/workflows/apple.yml
      - .github/workflows/native-changes.yml
      - .github/actions/apple-last-build/**
  pull_request:
    branches: [main]
    paths:
      - apps/apple/**
      - .github/workflows/apple.yml
      - .github/workflows/native-changes.yml
      - .github/actions/apple-last-build/**
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  changes:
    uses: ./.github/workflows/native-changes.yml
    # Finding the last passing run reads this workflow's runs.
    permissions:
      contents: read
      actions: read
    with:
      app: apple

  format:
    name: ${{ github.event_name == 'pull_request' && 'Swift formatting and Mac unit tests' || 'Swift formatting and Mac build cache' }}
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    concurrency:
      group: ${{ github.workflow }}-format-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Restore Mac test build
        id: last
        uses: ./.github/actions/apple-last-build
        with:
          build: catalyst

      - name: Check Swift formatting
        run: make -C apps/apple format-check formatting-check

      - name: Build Mac test bundle or run its units
        id: mac
        if: github.event_name == 'pull_request' || steps.last.outputs.build-hit != 'true'
        env:
          XCODEBUILD_ARGUMENTS: >-
            -clonedSourcePackagesDirPath ${{ runner.temp }}/apple-source-packages
            -onlyUsePackageVersionsFromResolvedFile
            -skipPackageUpdates
            COMPILER_INDEX_STORE_ENABLE=NO
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            make -C apps/apple test-mac XCODEBUILD_ARGUMENTS="$XCODEBUILD_ARGUMENTS -resultBundlePath $RUNNER_TEMP/apple-mac-units.xcresult"
          else
            make -C apps/apple build-mac-tests
          fi

      - name: Report Mac unit test results
        if: always() && github.event_name == 'pull_request' && steps.mac.outcome != 'skipped'
        shell: bash
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/apple-mac-units.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save Mac test build
        if: github.event_name == 'push' && steps.last.outputs.build-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/DerivedData/Make
          key: ${{ steps.last.outputs.build-key }}

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event.pull_request.number || github.run_id }}
      # A newer push waits for the running build instead of cancelling it, so a busy PR's build still
      # finishes.
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Restore the last build
        id: last
        uses: ./.github/actions/apple-last-build
        with:
          build: device

      - name: Build iPhone and iPad app
        env:
          # CI only checks that the app compiles, so it skips debug info.
          XCODEBUILD_ARGUMENTS: >-
            -clonedSourcePackagesDirPath ${{ runner.temp }}/apple-source-packages
            -onlyUsePackageVersionsFromResolvedFile
            -skipPackageUpdates
            COMPILER_INDEX_STORE_ENABLE=NO
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO
        run: make -C apps/apple build

      - name: Save Swift packages
        if: github.ref == 'refs/heads/main' && steps.last.outputs.packages-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apple-source-packages
          key: ${{ steps.last.outputs.packages-key }}

      - name: Check String Catalogs
        run: make -C apps/apple strings-check

      - name: Save this build
        if: github.ref == 'refs/heads/main' && steps.last.outputs.build-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/DerivedData/Make
          key: ${{ steps.last.outputs.build-key }}

  test:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The simulator build compiles differently from the build job's device build, so it keeps its
      # own saved build.
      - name: Restore the last build
        id: last
        uses: ./.github/actions/apple-last-build
        with:
          build: simulator

      - name: Run unit tests
        env:
          XCODEBUILD_ARGUMENTS: >-
            -clonedSourcePackagesDirPath ${{ runner.temp }}/apple-source-packages
            -onlyUsePackageVersionsFromResolvedFile
            -skipPackageUpdates
            -resultBundlePath ${{ runner.temp }}/apple-unit-tests.xcresult
            COMPILER_INDEX_STORE_ENABLE=NO
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO
        # The newest runtime the image installs, which can trail Xcode's SDK while a new image rolls out
        # (xcodebuild's default OS is the SDK's).
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries | sort_by(.key) | .[].value[] | select(.name == "iPhone 17")] | last | .udid')
          make -C apps/apple test TEST_DESTINATION="platform=iOS Simulator,id=$udid"

      - name: Report unit test results
        if: always()
        shell: bash
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/apple-unit-tests.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save this build
        if: steps.last.outputs.build-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/DerivedData/Make
          key: ${{ steps.last.outputs.build-key }}
