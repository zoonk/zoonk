name: Apple App

on:
  push:
    branches: [main]
    paths: [apps/apple/**, .github/workflows/apple.yml, .github/workflows/native-changes.yml]
  pull_request:
    branches: [main]
    paths: [apps/apple/**, .github/workflows/apple.yml, .github/workflows/native-changes.yml]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  changes:
    uses: ./.github/workflows/native-changes.yml
    # Finding the last passing run reads this workflow's runs.
    permissions:
      contents: read
      actions: read
    with:
      app: apple

  format:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    concurrency:
      group: ${{ github.workflow }}-format-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check Swift formatting
        run: make -C apps/apple format-check

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event.pull_request.number || github.run_id }}
      # A newer push waits for the running build instead of cancelling it, so a busy PR's build still
      # finishes.
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Identify Xcode toolchain
        id: xcode
        run: |
          set -o pipefail
          xcodebuild -version | shasum -a 256 | awk '{ print "version=" $1 }' >> "$GITHUB_OUTPUT"

      # Only main saves these caches. A pull request's own entries serve only its later runs, and in
      # the repository's shared cache storage they evict main's, which every pull request restores.
      - name: Restore Swift packages
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apple-source-packages
          # Frozen resolution needs a cache containing this lockfile's revisions.
          key: ${{ runner.os }}-${{ runner.arch }}-apple-swiftpm-${{ hashFiles('apps/apple/**/Package.resolved') }}

      - name: Restore Xcode compilations
        id: compilations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/DerivedData/Make/CompilationCache.noindex
          # Any app edit recompiles the whole app module, so the key follows the packages, the API
          # client and the project; Xcode or build flag changes start from an empty cache.
          key: ${{ runner.os }}-${{ runner.arch }}-apple-compilation-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/apple/Makefile', '.github/workflows/apple.yml') }}-${{ hashFiles('apps/apple/**/Package.resolved', 'apps/apple/**/*.xcproj', 'apps/apple/ZoonkAPI/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apple-compilation-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/apple/Makefile', '.github/workflows/apple.yml') }}-

      - name: Build iPhone and iPad app
        env:
          # CI only checks that the app compiles, so it skips debug info.
          XCODEBUILD_ARGUMENTS: >-
            -clonedSourcePackagesDirPath ${{ runner.temp }}/apple-source-packages
            -onlyUsePackageVersionsFromResolvedFile
            -skipPackageUpdates
            COMPILATION_CACHE_ENABLE_CACHING=YES
            COMPILER_INDEX_STORE_ENABLE=NO
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO
        run: make -C apps/apple build

      - name: Save Swift packages
        if: github.ref == 'refs/heads/main' && steps.swiftpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apple-source-packages
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

      - name: Save Xcode compilations
        if: github.ref == 'refs/heads/main' && steps.compilations.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/DerivedData/Make/CompilationCache.noindex
          key: ${{ steps.compilations.outputs.cache-primary-key }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Check String Catalogs
        run: make -C apps/apple strings-check

  test:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apple-source-packages
          key: ${{ runner.os }}-${{ runner.arch }}-apple-swiftpm-${{ hashFiles('apps/apple/**/Package.resolved') }}

      - name: Run unit tests
        env:
          # Match the runtime installed on xcode-27; revisit alongside DEVELOPER_DIR.
          TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
          XCODEBUILD_ARGUMENTS: >-
            -clonedSourcePackagesDirPath ${{ runner.temp }}/apple-source-packages
            -onlyUsePackageVersionsFromResolvedFile
            -skipPackageUpdates
            -resultBundlePath ${{ runner.temp }}/apple-unit-tests.xcresult
        run: make -C apps/apple test

      - name: Report unit test results
        if: always()
        shell: bash
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/apple-unit-tests.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
