name: Apple App

on:
  push:
    branches: [main]
    paths: [apps/apple/**]
  pull_request:
    branches: [main]
    paths: [apps/apple/**]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push waits for the running build instead of cancelling it: on a busy PR, pushes came
  # faster than the build runs, so it rarely finished or saved its compilation cache. GitHub keeps
  # one run pending, the newest.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  format:
    runs-on: xcode-27
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check Swift formatting
        run: make -C apps/apple format-check

  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Identify Xcode toolchain
        id: xcode
        run: |
          set -o pipefail
          xcodebuild -version | shasum -a 256 | awk '{ print "version=" $1 }' >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apple-source-packages
          # Frozen resolution needs a cache containing this lockfile's revisions.
          key: ${{ runner.os }}-${{ runner.arch }}-apple-swiftpm-${{ hashFiles('apps/apple/**/Package.resolved') }}

      - name: Cache Xcode compilations
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          # Any app edit recompiles the whole app module, so the cache pays off for packages and the
          # API client: a new entry is saved when they or the project change, on top of the last one.
          # Xcode or build flag changes invalidate every entry, so they start from an empty cache.
          key: ${{ runner.os }}-${{ runner.arch }}-apple-compilation-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/apple/Makefile', '.github/workflows/apple.yml') }}-${{ hashFiles('apps/apple/**/Package.resolved', 'apps/apple/**/*.xcproj', 'apps/apple/ZoonkAPI/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apple-compilation-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/apple/Makefile', '.github/workflows/apple.yml') }}-

      - name: Build iPhone and iPad app
        env:
          # CI only checks that the app compiles, so it skips debug info (about 10% of compile time).
          XCODEBUILD_ARGUMENTS: >-
            -clonedSourcePackagesDirPath ${{ runner.temp }}/apple-source-packages
            -onlyUsePackageVersionsFromResolvedFile
            -skipPackageUpdates
            COMPILATION_CACHE_ENABLE_CACHING=YES
            COMPILER_INDEX_STORE_ENABLE=NO
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO
        run: make -C apps/apple build
