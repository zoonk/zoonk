name: Code Quality

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zoonk_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/zoonk_test
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Node comes from the runner's tool cache: pnpm/setup would download it from nodejs.org,
      # whose slow downloads time jobs out.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: false
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # The OpenAPI schemas import Prisma enums, so the client must exist first.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check generated OpenAPI artifact
        run: pnpm openapi:check

      - name: Check for i18n errors
        run: pnpm i18n:lint

      - name: Run type check
        run: pnpm typecheck

      - name: Run formatter
        run: pnpm turbo format

      - name: Run linter
        run: pnpm turbo lint

      - name: Run knip
        run: pnpm knip && pnpm knip --production

      - name: Test deployment orchestration
        run: pnpm test:deploy
