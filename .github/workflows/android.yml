name: Android App

on:
  push:
    branches: [main]
    paths: [apps/android/**, .github/workflows/android.yml, .github/workflows/native-changes.yml]
  pull_request:
    branches: [main]
    paths: [apps/android/**, .github/workflows/android.yml, .github/workflows/native-changes.yml]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  GRADLE_ARGUMENTS: --no-daemon --console=plain --profile -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx2g

jobs:
  changes:
    uses: ./.github/workflows/native-changes.yml
    with:
      app: android

  compile:
    name: compile
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-compile-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - &checkout
        name: Check out code
        uses: actions/checkout@v7

      - &java
        name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - &android
        name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - &gradle
        name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: false

      - name: Compile shared Release inputs
        run: make -C apps/android build BUILD_TASKS=:app:compileReleaseKotlin

      - name: Share compiled task outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-compile-cache
          path: |
            ~/.gradle/caches/build-cache-1/*
            !~/.gradle/caches/build-cache-1/*.lock
            !~/.gradle/caches/build-cache-1/gc.properties
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - &profiles
        name: Upload task profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-${{ matrix.job || 'compile' }}
          path: apps/android/build/reports/profile/

  gradle:
    name: ${{ matrix.job }}
    needs: compile
    if: ${{ !cancelled() && needs.compile.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.job }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: checks
            target: lint
            tasks: :app:lintRelease
          - job: style
            target: lint
            tasks: spotlessCheck :lint-checks:test
          - job: tests
            target: test
          - job: release
            target: build
            arguments: -x :app:lintVitalRelease
    steps:
      - name: Require successful compilation
        if: needs.compile.result != 'success'
        run: exit 1

      - *checkout
      - *java
      - *android
      - *gradle

      - name: Restore compiled task outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-compile-cache
          path: ~/.gradle/caches/build-cache-1
          digest-mismatch: error

      - name: Run Gradle
        run: make -C apps/android ${{ matrix.target }} GRADLE_ARGUMENTS="$GRADLE_ARGUMENTS ${{ matrix.arguments }}" ${{ matrix.tasks && format('LINT_TASKS="{0}"', matrix.tasks) || '' }}

      - *profiles
