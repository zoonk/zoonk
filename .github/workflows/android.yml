name: Android App
run-name: Same-host R8 JVM pairs 1
on:
  push:
    branches: [ci/android-speed]
    paths: [.github/workflows/android.yml]
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: fd10c679dc4840319a1221729910970ce3b207bc
jobs:
  r8-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-compile-cache-release
          path: ~/.gradle/caches/build-cache-1
          run-id: 41104856912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error
      - name: Validate candidate settings without building
        run: python3 apps/android/.ci-r8-pairs.py validate
      - name: Prewarm both complete release builds
        run: python3 apps/android/.ci-r8-pairs.py warmup
      - name: Save warmup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-jvm-warmup
          path: |
            probe/*settings.gradle.kts
            probe/cpuinfo.txt
            probe/results.json
            probe/validate-candidate/
            probe/warmup-*/
          retention-days: 2
      - name: Pair 1 baseline then candidate
        run: python3 apps/android/.ci-r8-pairs.py pair1
      - name: Save pair 1
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-jvm-pair1
          path: |
            probe/results.json
            probe/pair1-*/
          retention-days: 2
      - name: Pair 2 candidate then baseline
        run: python3 apps/android/.ci-r8-pairs.py pair2
      - name: Save pair 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-jvm-pair2
          path: |
            probe/results.json
            probe/pair2-*/
          retention-days: 2
      - name: Pair 3 baseline then candidate
        run: python3 apps/android/.ci-r8-pairs.py pair3
      - name: Save pair 3
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-jvm-pair3
          path: |
            probe/results.json
            probe/pair3-*/
          retention-days: 2
