name: Android App

on:
  push:
    branches: [main]
    paths: [apps/android/**, .github/workflows/android.yml]
  pull_request:
    branches: [main]
    paths: [apps/android/**, .github/workflows/android.yml]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gradle:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Parallel jobs keep each one under 5 minutes as the app grows; `make check` runs all three.
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: checks
            target: lint
          - job: tests
            target: test
          - job: release
            target: build
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Pull requests write their own cache scope too, so each run after a PR's first starts
          # warm. They read main's scope but never write it.
          cache-read-only: false

      - name: Run Gradle
        env:
          # Full Release lint, including fatal issues, runs in the checks job.
          GRADLE_ARGUMENTS: --no-daemon --console=plain --profile -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx2g ${{ matrix.job == 'release' && '-x :app:lintVitalRelease' || '' }}
        run: make -C apps/android ${{ matrix.target }}

      - name: Upload task profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-${{ matrix.job }}
          path: apps/android/build/reports/profile/
