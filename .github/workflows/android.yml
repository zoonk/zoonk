name: Android App

on:
  # Every branch, so each push writes its branch's Gradle cache and the next push starts warm.
  push:
    branches: ["**"]
    paths: [apps/android/**, .github/workflows/android.yml]
  pull_request:
    branches: [main]
    paths: [apps/android/**, .github/workflows/android.yml]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gradle:
    name: ${{ matrix.job }}
    # A pull request from this repository already shows its branch push's checks; forks run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Parallel jobs keep each one under 5 minutes as the app grows; `make check` runs all three.
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: checks
            target: lint
          - job: tests
            target: test
          - job: release
            target: build
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run Gradle
        env:
          GRADLE_ARGUMENTS: --no-daemon --console=plain
        run: make -C apps/android ${{ matrix.target }}
