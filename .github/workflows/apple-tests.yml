name: Apple Unit Tests

# Started by hand on any branch: `gh workflow run apple-tests.yml --ref <branch>`. Pull requests
# skip Apple's unit tests (apple.yml runs them after merge), so this runs them before.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Restores main's caches and saves none, so a branch's entries don't evict main's.
      - name: Restore the last build
        uses: ./.github/actions/apple-last-build
        with:
          build: catalyst

      - name: Run unit tests
        env:
          XCODEBUILD_ARGUMENTS: >-
            -clonedSourcePackagesDirPath ${{ runner.temp }}/apple-source-packages
            -onlyUsePackageVersionsFromResolvedFile
            -skipPackageUpdates
            -resultBundlePath ${{ runner.temp }}/apple-unit-tests.xcresult
            COMPILER_INDEX_STORE_ENABLE=NO
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO
        run: make -C apps/apple test

      - name: Report unit test results
        if: always()
        shell: bash
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/apple-unit-tests.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
