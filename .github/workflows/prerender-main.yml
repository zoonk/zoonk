name: Main Prerender Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: test-secret-for-ci
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zoonk_e2e
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/zoonk_e2e
      E2E_TESTING: "true"
      NEXT_PUBLIC_APP_DOMAIN: localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    services:
      db:
        image: postgres:18-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zoonk_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup E2E database
        run: pnpm --filter @zoonk/db db:setup:e2e

      # Direct workspace builds bypass Turbo's Prisma-generation prerequisite.
      - name: Generate Prisma client
        run: pnpm --filter @zoonk/db db:generate

      - name: Build the central E2E API
        run: pnpm --filter api build:e2e
        env:
          NEXT_PUBLIC_AUTH_BASE_PATH: /v1/auth

      - name: Prepare Main fixtures
        run: pnpm --filter main exec node ../../scripts/run-test-env.mts e2e tsx e2e/prepare-data.ts

      - name: Validate all development page prerenders
        run: node scripts/e2e/prerender-crawl.mts
