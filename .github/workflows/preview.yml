name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID_API: ${{ vars.VERCEL_PROJECT_ID_API }}
  VERCEL_PROJECT_ID_MAIN: ${{ vars.VERCEL_PROJECT_ID_MAIN }}
  VERCEL_PROJECT_ID_ADMIN: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
      DEPLOY_REF: ${{ github.event.pull_request.head.ref }}
      DEPLOY_TARGET: preview
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH }}
      NEON_STAGING_BRANCH: ${{ vars.NEON_STAGING_BRANCH }}
      NEON_DATABASE: ${{ vars.NEON_DATABASE }}
      NEON_ROLE: ${{ vars.NEON_ROLE }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          runtime: node@24
          cache: true
      - name: Cancel superseded remote preview builds
        run: pnpm deploy cancel-previews
      - name: Check affected applications
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$DEPLOY_SHA" -- apps/main apps/api apps/admin packages package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json .github/workflows/preview.yml scripts/deploy; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Confirm this is still the current PR commit
        if: steps.affected.outputs.deploy == 'true'
        run: pnpm deploy check-preview
      - name: Validate the preview database parent
        if: steps.affected.outputs.deploy == 'true'
        run: pnpm deploy:database
      - name: Create or reuse the PR database branch
        if: steps.affected.outputs.deploy == 'true'
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          database: ${{ env.NEON_DATABASE }}
          role: ${{ env.NEON_ROLE }}
          suspend_timeout: 300
      - name: Migrate the PR database once
        if: steps.affected.outputs.deploy == 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @zoonk/db db:deploy
      - name: Deploy API, then its consumers against the same PR database
        if: steps.affected.outputs.deploy == 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm deploy preview
      - name: Cancel remote builds when this workflow is canceled or fails
        if: cancelled() || failure()
        run: pnpm deploy cancel-run

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          runtime: node@24
          cache: true
      - name: Clean up the closed PR
        run: pnpm deploy:cleanup
