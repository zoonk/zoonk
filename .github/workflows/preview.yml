name: PR Preview

# Previews run on request (`pnpm preview [pr]`, or "Run workflow" in Actions), not on every push.
# Closing the PR still cleans up its preview.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID_API: ${{ vars.VERCEL_PROJECT_ID_API }}
  VERCEL_PROJECT_ID_MAIN: ${{ vars.VERCEL_PROJECT_ID_MAIN }}
  VERCEL_PROJECT_ID_ADMIN: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      PR_NUMBER: ${{ inputs.pr }}
      DEPLOY_TARGET: preview
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH }}
      NEON_STAGING_BRANCH: ${{ vars.NEON_STAGING_BRANCH }}
      NEON_DATABASE: ${{ vars.NEON_DATABASE }}
      NEON_ROLE: ${{ vars.NEON_ROLE }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Secrets deploy this code, so only an open PR from this repository can be previewed.
      - name: Read the pull request
        run: |
          IFS=$'\t' read -r state repo sha ref < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.state, .head.repo.full_name, .head.sha, .head.ref] | @tsv'
          )

          if [ "$state" != "open" ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Only an open pull request from $GITHUB_REPOSITORY can be previewed"
            exit 1
          fi

          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"
          echo "DEPLOY_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Cancel superseded remote preview builds
        run: pnpm deploy cancel-previews
      - name: Confirm this is still the current PR commit
        run: pnpm deploy check-preview
      - name: Validate the preview database parent
        run: pnpm deploy:database
      - name: Create or reuse the PR database branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ inputs.pr }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          database: ${{ env.NEON_DATABASE }}
          role: ${{ env.NEON_ROLE }}
          suspend_timeout: 300
      - name: Migrate the PR database once
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter @zoonk/db db:deploy
      - name: Deploy every app at once against the same PR database
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: pnpm deploy preview
      - name: Cancel remote builds when this workflow is canceled or fails
        if: cancelled() || failure()
        run: pnpm deploy cancel-run

  cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Clean up the closed PR
        run: pnpm deploy:cleanup
