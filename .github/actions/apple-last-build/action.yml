name: Restore the last Apple build
description: >-
  Restores the Swift packages and the last build main saved, so xcodebuild recompiles only what
  changed since instead of the whole app and its packages.

inputs:
  build:
    description: The Xcode destination to restore (`device`, `simulator` or `catalyst`).
    required: true

outputs:
  packages-key:
    description: The key to save the Swift packages under.
    value: ${{ steps.packages.outputs.cache-primary-key }}
  packages-hit:
    description: "`true` when the packages were restored from that exact key."
    value: ${{ steps.packages.outputs.cache-hit }}
  build-key:
    description: The primary key for this build.
    value: ${{ steps.build.outputs.cache-primary-key }}
  build-hit:
    description: "`true` when the exact build key exists."
    value: ${{ steps.build.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json

    - name: Identify Xcode build
      id: cache
      env:
        DESTINATION: ${{ inputs.build }}
        BUILD_INPUTS: ${{ hashFiles('apps/apple/**/Package.resolved', '.github/workflows/apple.yml', '.github/actions/apple-last-build/**') }}
        CATALYST_CONFIG: ${{ hashFiles('apps/apple/Makefile', 'apps/apple/Configuration/**', 'apps/apple/Zoonk.xcodeproj/project.xcproj') }}
      shell: bash
      run: |
        set -o pipefail
        xcode=$(xcodebuild -version | shasum -a 256 | awk '{ print $1 }')
        prefix="$RUNNER_OS-$RUNNER_ARCH-apple-$DESTINATION-build-$xcode-$BUILD_INPUTS-"
        if [[ "$DESTINATION" == catalyst ]]; then
          echo "key=$prefix$CATALYST_CONFIG" >> "$GITHUB_OUTPUT"
        else
          echo "key=$prefix$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        fi

    # Device and simulator builds follow main. PRs share one Catalyst build per configuration:
    # main only needs to compile it again when it changes or GitHub evicts it.
    - name: Restore the last build
      id: build
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        lookup-only: ${{ inputs.build == 'catalyst' && github.event_name == 'push' }}
        path: apps/apple/DerivedData/Make
        key: ${{ steps.cache.outputs.key }}
        restore-keys: ${{ steps.cache.outputs.prefix }}

    # Only main saves these caches. A pull request's own entries serve only its later runs, and in
    # the repository's shared cache storage they evict main's, which every pull request restores.
    - name: Restore Swift packages
      if: inputs.build != 'catalyst' || github.event_name != 'push' || steps.build.outputs.cache-hit != 'true'
      id: packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/apple-source-packages
        # Frozen resolution needs a cache containing this lockfile's revisions.
        key: ${{ runner.os }}-${{ runner.arch }}-apple-swiftpm-${{ hashFiles('apps/apple/**/Package.resolved') }}

    - name: Make the checkout match the restored build
      if: inputs.build != 'catalyst' || github.event_name != 'push' || steps.build.outputs.cache-hit != 'true'
      shell: bash
      run: node apps/apple/scripts/reuse-build.mts
