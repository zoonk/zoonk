packages:
  - apps/*
  - packages/*

allowBuilds:
  "@nestjs/core": false
  "@parcel/watcher": false
  "@prisma/engines": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  cbor-extract: false
  core-js: false
  esbuild: true
  # Optional native acceleration; the serializer supports its JavaScript fallback.
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: false

catalog:
  "@apple/app-store-server-library": 3.1.0
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@eloqnt/cli": 0.6.30
  "@eloqnt/format-android-xml": 0.0.9
  "@eloqnt/format-apple-xcstrings": 0.0.9
  "@mdx-js/loader": 3.1.1
  "@mdx-js/react": 3.1.1
  "@next/mdx": 16.3.5
  "@next/third-parties": 16.3.5
  "@playwright/test": 1.63.0
  "@sentry/nextjs": 10.75.0
  "@tailwindcss/postcss": 4.3.3
  "@testing-library/react": 16.3.3
  "@types/mdx": 2.0.14
  "@types/node": ^24
  "@types/react-dom": ^19.3.0
  "@types/react": ^19.3.0
  "@vercel/analytics": 2.0.1
  "@vitejs/plugin-react": 6.1.1
  ai: 7.0.107
  botid: 1.5.11
  jsdom: 30.1.0
  katex: 0.18.7
  lucide-react: 1.47.0
  next-intl: 4.14.5
  next: 16.3.5
  nuqs: 2.10.1
  playwright: 1.63.0
  posthog-js: 1.434.2
  raw-loader: 4.0.2
  react-dom: 19.3.0
  react: 19.3.0
  recharts: 3.10.1
  server-only: 0.0.1
  sharp: 0.35.4
  tsx: 4.23.13
  typescript: 7.0.2
  vite: 8.3.0
  vitest: 5.0.1
  zod: 4.6.5

minimumReleaseAge: 0

overrides:
  # Keep this override because we don't want to install codex in this repo
  "ai-sdk-provider-codex-cli>@openai/codex": "-"
  # Audit remediation: deepmerge-ts 8 fixes prototype pollution in transitive ranges.
  deepmerge-ts@<8.0.0: ^8.0.0
  # Keep lesson and question math on the same KaTeX version as the stylesheet.
  katex: "catalog:"
  # Audit remediation: mysql2 3.23.1 covers both outstanding security advisories.
  mysql2@<=3.23.0: ^3.23.1
  # Audit remediation: nanoid 5.1.16 covers both outstanding security advisories.
  nanoid@>=4.0.0 <5.1.16: ^5.1.16
