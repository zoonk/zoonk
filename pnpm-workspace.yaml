packages:
  - apps/*
  - packages/*

allowBuilds:
  "@nestjs/core": false
  "@parcel/watcher": false
  "@prisma/engines": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  cbor-extract: false
  core-js: false
  esbuild: true
  # Optional native acceleration; the serializer supports its JavaScript fallback.
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: false
  # officeparser's OCR dependency; its postinstall only prints a funding message.
  tesseract.js: false

catalog:
  "@apple/app-store-server-library": 3.1.0
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@eloqnt/cli": 0.6.33
  "@eloqnt/format-android-xml": 0.0.9
  "@eloqnt/format-apple-xcstrings": 0.0.9
  "@mdx-js/loader": 3.1.1
  "@mdx-js/react": 3.1.1
  "@next/mdx": 16.4.3
  "@next/playwright": 16.4.3
  "@next/third-parties": 16.4.3
  "@playwright/test": 1.64.1
  "@sentry/nextjs": 11.10.0
  "@tailwindcss/turbopack": 4.3.4
  "@tailwindcss/vite": 4.3.4
  "@testing-library/react": 16.3.3
  "@types/mdx": 2.0.14
  "@types/node": ^26
  "@types/react-dom": ^19.3.0
  "@types/react": ^19.3.0
  "@vercel/analytics": 2.0.1
  "@vitejs/plugin-react": 6.1.2
  ai: 7.0.159
  botid: 1.5.12
  icu-minify: 4.14.9
  jose: 6.2.14
  jsdom: 30.1.3
  katex: 0.19.1
  lucide-react: 1.66.0
  next-intl: 4.14.9
  next: 16.4.3
  nuqs: 2.10.2
  playwright: 1.64.1
  posthog-js: 1.444.0
  raw-loader: 4.0.2
  react-dom: 19.3.1
  react: 19.3.1
  recharts: 3.10.1
  server-only: 0.0.1
  sharp: 0.35.5
  tsx: 4.23.15
  typescript: 7.0.2
  undici: 8.12.3
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7

minimumReleaseAge: 0

overrides:
  # This repo never installs codex.
  "ai-sdk-provider-codex-cli>@openai/codex": "-"
  # Keep lesson and question math on the same KaTeX version as the stylesheet.
  katex: "catalog:"
  # Audit remediation (Neon CLI): 2.1.3 covers the serveStatic and WebSocket handshake advisories in 2.0.x.
  "@hono/node-server@>=1.19.10 <2.1.3": ^2.1.3
  # Audit remediation (Neon CLI): diff 5.2.2 stops parsePatch and applyPatch from looping on crafted patches.
  diff@>=5.0.0 <5.2.2: ^5.2.2
  # Audit remediation (Sentry's bundler plugins and @vercel/nft pin glob 13): 14.0.2 stops an aborted walk from reading on; both only call glob(pattern, options), which 14 keeps.
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  # Audit remediation (Workflow CLI, Workflow's Nest builder, glob): only minimatch 11.0.1 fixes the globparts DoS; these callers only use minimatch() and match(), which 11 keeps.
  minimatch@<11.0.1: ^11.0.1
  # Audit remediation (@tailwindcss/typography pins 6.0.10): 6.1.5 parses flat selectors in linear time.
  postcss-selector-parser@<6.1.5: ^6.1.5
  # Audit remediation (Workflow SDK worlds pin 7.30.0): 7.30.1 covers the current undici advisories.
  undici@>=7.0.0 <7.30.1: ^7.30.1
  # Audit remediation (Vercel CLI auth/config pin 4.1, Workflow SDK pins ~4.5.4): 4.6.6 stops oversized constrained collections from exhausting memory.
  zod@<4.6.6: ^4.6.6
