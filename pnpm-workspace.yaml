packages:
  - apps/*
  - packages/*

allowBuilds:
  "@nestjs/core": false
  "@parcel/watcher": false
  "@prisma/engines": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  cbor-extract: false
  core-js: false
  esbuild: true
  # Optional native acceleration; the serializer supports its JavaScript fallback.
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: false
  # officeparser's OCR dependency; its postinstall only prints a funding message.
  tesseract.js: false

catalog:
  "@apple/app-store-server-library": 3.1.0
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@eloqnt/cli": 0.7.1
  "@eloqnt/format-android-xml": 0.0.11
  "@eloqnt/format-apple-xcstrings": 0.0.10
  "@mdx-js/loader": 3.1.1
  "@mdx-js/react": 3.1.1
  "@next/mdx": 16.4.6
  "@next/playwright": 16.4.6
  "@next/third-parties": 16.4.6
  "@playwright/test": 1.65.1
  "@sentry/nextjs": 11.12.0
  "@tailwindcss/turbopack": 4.3.5
  "@tailwindcss/vite": 4.3.5
  "@testing-library/react": 16.3.3
  "@types/mdx": 2.0.14
  "@types/node": ^26
  "@types/react-dom": ^19.3.0
  "@types/react": ^19.3.0
  "@vercel/analytics": 2.0.1
  "@vitejs/plugin-react": 6.3.0
  ai: 7.0.173
  fast-check: 4.10.2
  icu-minify: 4.15.2
  jose: 6.2.17
  jsdom: 31.0.1
  katex: 0.19.1
  lucide-react: 1.73.0
  next-intl: 4.15.1
  next: 16.4.6
  nuqs: 2.10.3
  playwright: 1.65.1
  posthog-js: 1.449.2
  raw-loader: 4.0.2
  react-dom: 19.3.1
  react: 19.3.1
  recharts: 3.10.1
  server-only: 0.0.1
  sharp: 0.35.5
  translation-resilience: 0.5.0
  tsx: 4.23.15
  typescript: 7.1.0-beta
  undici: 8.12.4
  vite: 8.3.8
  vitest: 5.1.0
  zod: 4.6.7

minimumReleaseAge: 0

overrides:
  # This repo never installs codex.
  "ai-sdk-provider-codex-cli>@openai/codex": "-"
  # Lesson math and buddy answers share one KaTeX, so they draw formulas alike.
  katex: "catalog:"
  # Better Auth's passkey plugin asks for SimpleWebAuthn 13, whose certificate library loads before its Reflect polyfill in a Turbopack build ("tsyringe requires a reflect polyfill") and fails every app that imports auth. 14 loads the polyfill itself, is what the approval check already verifies with, and keeps the four functions the plugin calls.
  "@better-auth/passkey>@simplewebauthn/server": 14.1.0
  # Audit remediation (Neon CLI 9.5 pins 2.0.4): 2.1.6 covers the serveStatic double-decoding, Windows path traversal, WebSocket handshake leak, upgrade ECONNRESET crash and backslash path advisories in 2.0.x and 2.1.0 to 2.1.5.
  "@hono/node-server@>=1.19.10 <2.1.6": ^2.1.6
  # Audit remediation (Neon CLI 9.5 pins 5.2.0): diff 5.2.2 stops parsePatch and applyPatch from looping on crafted patches.
  diff@>=5.0.0 <5.2.2: ^5.2.2
  # Audit remediation (Workflow's queue client (@vercel/queue) and CLI (@oclif/core) ask for ^10.2): only minimatch 11.0.1 fixes the globparts DoS; these callers only use minimatch(), which 11 keeps.
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  # Audit remediation (@tailwindcss/typography pins 6.0.10): 6.1.5 parses flat selectors in linear time.
  postcss-selector-parser@<6.1.5: ^6.1.5
  # Audit remediation (Vercel CLI auth and config, through Workflow and Blob's OIDC client, pin 4.1.11): 4.6.6 stops oversized constrained collections from exhausting memory.
  zod@<4.6.6: ^4.6.6
