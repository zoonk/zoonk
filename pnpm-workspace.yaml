packages:
  - apps/*
  - packages/*

allowBuilds:
  "@nestjs/core": false
  "@parcel/watcher": false
  "@prisma/engines": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  cbor-extract: false
  core-js: false
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: false

catalog:
  "@apple/app-store-server-library": 3.1.0
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@eloqnt/cli": 0.6.29
  "@eloqnt/format-android-xml": 0.0.8
  "@eloqnt/format-apple-xcstrings": 0.0.8
  "@mdx-js/loader": 3.1.1
  "@mdx-js/react": 3.1.1
  "@next/mdx": 16.3.4
  "@next/third-parties": 16.3.4
  "@playwright/test": 1.63.0
  "@sentry/nextjs": 10.73.0
  "@tailwindcss/postcss": 4.3.3
  "@testing-library/react": 16.3.3
  "@types/mdx": 2.0.14
  "@types/node": ^24
  "@types/react-dom": ^19.2.7
  "@types/react": ^19.2.18
  "@vercel/analytics": 2.0.1
  "@vitejs/plugin-react": 6.1.1
  ai: 7.0.94
  botid: 1.5.11
  jsdom: 30.0.1
  katex: 0.18.7
  lucide-react: 1.43.0
  next-intl: 4.14.2
  next: 16.3.4
  nuqs: 2.10.1
  playwright: 1.63.0
  posthog-js: 1.428.7
  raw-loader: 4.0.2
  react-dom: 19.2.8
  react: 19.2.8
  recharts: 3.10.1
  server-only: 0.0.1
  sharp: 0.35.4
  tsx: 4.23.13
  typescript: 7.0.2
  vite: 8.2.2
  vitest: 5.0.0
  zod: 4.5.4

minimumReleaseAge: 0

overrides:
  # Keep this override because we don't want to install codex in this repo
  "ai-sdk-provider-codex-cli>@openai/codex": "-"
  # Audit remediation: force vulnerable transitive deepmerge-ts ranges onto the patched v8 release.
  deepmerge-ts@<8.0.0: ^8.0.0
  # Keep lesson and question math on the same KaTeX version as the stylesheet.
  katex: "catalog:"
  # Audit remediation: require the mysql2 security fixes introduced in 3.22.0.
  mysql2@<3.22.0: ^3.22.0
  # Audit remediation: cover the additional mysql2 advisory fixed in 3.23.1.
  mysql2@<=3.23.0: ^3.23.1
  # Audit remediation: require the nanoid security fixes introduced in 5.1.11.
  nanoid@>=4.0.0 <5.1.11: ^5.1.11
  # Audit remediation: cover the additional nanoid advisory fixed in 5.1.16.
  nanoid@>=4.0.0 <5.1.16: ^5.1.16

peerDependencyRules:
  allowedVersions:
    # Better Auth uses this optional peer only in its test helpers; our Vitest 5 suites pass.
    "better-auth@1.7.3>vitest": "5.0.0"
